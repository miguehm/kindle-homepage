name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: Lua 5.1 gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Syntax gate (Lua 5.1)
        run: ./scripts/check_lua51.sh
      - name: Structural invariants
        run: ./scripts/check_invariants.sh
      - name: Offline UI smokes
        run: LUA=lua5.1 ./scripts/smoke_ui.sh
